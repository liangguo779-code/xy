server:
  port: 9000

spring:
  application:
    name: campus-app
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/campus?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:123456}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:3242262405@qq.com}
    password: ${MAIL_PASSWORD:pmgbbgstydkschff}
    properties:
      mail.smtp.ssl.enable: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-header: true
  is-read-cookie: false
  is-log: false
  public-paths: /api/auth/login,/api/auth/register,/api/auth/send-code,/api/auth/reset-password,/api/auth/bootstrap-admin,/api/auth/send-email-code,/api/auth/verify-email-code,/api/auth/captcha,/api/goods,/api/goods/recommend,/api/goods/*,/api/categories,/api/forum/posts,/api/forum/posts/*,/api/forum/posts/*/comments,/api/forum/posts/*/comments/tree,/api/ai/**,/doc.html,/webjars/**,/v3/api-docs/**,/swagger-resources/**,/ws/**,/uploads/**
  anonymous-paths: /api/ai/**

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# AI service
# `ai.service.url` is the legacy property consumed by the old Python proxy in
# AiServiceImpl; it is no longer required by the in-process LangChain4j
# implementation but is kept so existing operator shell history and docker
# compose files (which still set AI_SERVICE_URL) do not break silently. It can
# be removed once the compose file no longer references it.
ai:
  service:
    url: ${AI_SERVICE_URL:}

# Campus AI — in-process LangChain4j configuration. Values flow in from
# campus-platform/.env via the dotenv-maven-plugin (see backend/campus-app/pom.xml).
campus:
  ai:
    home: ${AI_HOME:./runtime}
    knowledge:
      dir: ${AI_KNOWLEDGE_DIR:${campus.ai.home}/knowledge}
      max-file-size: 20MB
      allowed-suffixes: .md,.txt,.pdf,.docx,.doc
      chunk-size: 500
      chunk-overlap: 50
      score-threshold: 0.8
      bm25-k: 60
    vector:
      index-name: campus_knowledge
      embedding-model: ${AI_EMBEDDING_MODEL:BAAI/bge-base-zh-v1.5}
      embedding-dim: 512
      rerank-topk: 5
      retrieve-topk: 10
    llm:
      provider: openai-compatible
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${OPENAI_API_KEY:}
      model: ${LLM_MODEL:deepseek-chat}
      temperature: 0.3
      timeout: 60s
    rebuild:
      max-concurrent: 1

# LangChain4j Spring Boot starter reads these to wire OpenAiChatModel.
langchain4j:
  chat-model:
    open-ai:
      api-key: ${campus.ai.llm.api-key:dummy}
      base-url: ${campus.ai.llm.base-url}
      model-name: ${campus.ai.llm.model}
      temperature: ${campus.ai.llm.temperature}
      timeout: ${campus.ai.llm.timeout}

# Delivery
delivery:
  service-fee: 5.00

# File storage
storage:
  type: local
  local:
    path: ${UPLOAD_PATH:C:/Users/Administrator/Desktop/agent/campus-platform/backend/uploads}
    url-prefix: ${UPLOAD_URL_PREFIX:/uploads}

# Elasticsearch
elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: 9200

logging:
  level:
    com.campus: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info
