# Campus AI — in-process LangChain4j configuration. Values flow in from
# campus-platform/.env via the dotenv-maven-plugin (see backend/campus-app/pom.xml).
# 注：legacy 的 ai.service.url（旧 Python 代理）已无任何代码消费，配置块已删除。
campus:
  moderation:
    # 关键词过滤为纯本地词库（sensitive_word 表），无外部检测引擎依赖
    # AI 审核阈值：违规置信度≥verify 自动拦截；合规置信度≥clear 自动放行；其余转人审
    ai-verify-threshold: 0.90
    ai-clear-threshold: 0.85
  ai:
    home: ${AI_HOME:./campus-ai/runtime}
    knowledge:
      dir: ${AI_KNOWLEDGE_DIR:${campus.ai.home}/knowledge}
      max-file-size: 20MB
      # .doc 旧二进制格式 DocumentConverter 不支持（仅支持 md/txt/pdf/docx），不允许上传
      allowed-suffixes: .md,.txt,.pdf,.docx
      chunk-size: 800
      # 超长块切分时并入下一块开头的尾部字符数（见 MarkdownSectionSplitter）
      chunk-overlap: 50
      # 换词重试阈值：cross-encoder 分数越低匹配越好（与 AiProperties 同域）。
      # 高于此值（匹配差）触发一次换词重试。原值 0.05 位于分数域之外，
      # 使 RagOrchestrator 的重试路径永远不可达，现校准为 -0.2。
      score-threshold: -0.2
      bm25-k: 60
    vector:
      index-name: campus_knowledge
      # 必须与 EmbeddingConfig 实际加载的 BgeSmallZhEmbeddingModel（Xenova/bge-small-zh，512 维）一致
      embedding-model: ${AI_EMBEDDING_MODEL:Xenova/bge-small-zh}
      embedding-dim: 512
      rerank-topk: 5
      retrieve-topk: 10
    llm:
      provider: openai-compatible
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${OPENAI_API_KEY:}
      model: ${LLM_MODEL:deepseek-chat}
      temperature: 0.3
      timeout: 60s
    rebuild:
      max-concurrent: 1
  # ES 同步事务性发件箱（Transactional Outbox）：
  # 业务写库时同事务写 es_sync_outbox，提交后踢一脚/定时轮询把变更落到 ES，崩溃不丢同步意图
  es:
    outbox:
      poll-interval-ms: 3000          # 兜底轮询间隔；正常路径由事务提交后踢一脚，秒级可见
      batch-size: 200                 # 单轮最多处理条数
      max-backoff-seconds: 300        # 同步失败指数退避上限
      retain-days: 7                  # 已同步记录保留天数，超期清理
      cleanup-cron: "0 40 4 * * ?"    # 每日清理已同步记录

# LangChain4j Spring Boot starter reads these to wire OpenAiChatModel.
langchain4j:
  chat-model:
    open-ai:
      api-key: ${campus.ai.llm.api-key:dummy}
      base-url: ${campus.ai.llm.base-url}
      model-name: ${campus.ai.llm.model}
      temperature: ${campus.ai.llm.temperature}
      timeout: ${campus.ai.llm.timeout}

# Delivery
delivery:
  service-fee: 5.00

# Trade: 延时任务（Redis zset 延时队列）
trade:
  request:
    expire-after: 12h              # 发起交易请求有效期，超时自动作废、可重新发起
  order:
    auto-confirm-receive-after: 7d # 送达后超时未确认收货自动确认
  hot-order:
    confirm-timeout: 60s           # 热卖订单二次确认截止，超时自动取消并释放库存
    consume-poll-ms: 200           # 热卖消费者轮询间隔（毫秒）——确认后「处理中」窗口由此决定
    consume-batch-size: 20         # 每轮最多消费条数
    release-scan-ms: 10000         # 待确认桶超时扫描间隔（毫秒，超时释放主路径）
    reconcile-processing-ms: 30000 # 处理中转区对账间隔（毫秒）
  delay-queue:
    poll-interval-ms: 5000         # 延时队列轮询间隔（毫秒）

# File storage
storage:
  type: local
  local:
    path: ${UPLOAD_PATH:C:/Users/Administrator/Desktop/agent/campus-platform/backend/uploads}
    url-prefix: ${UPLOAD_URL_PREFIX:/uploads}

# Elasticsearch
elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: 9200

logging:
  level:
    com.campus: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info
